name: Release SDK

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  release-sdk:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Publish to npm
        run: cd packages/plugin && bunx npm@latest publish

name: Deploy modules and docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - modules.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build modules
        run: bun compile

      - name: Sync modules
        run: bun scripts/deploy-modules.ts

      - name: Build docs
        run: bun build:docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./docs/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
